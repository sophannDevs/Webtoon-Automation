function keepNames(s) {
  return (META.names || []).reduce((t, n) => t.split(n).join(n.replace(/ /g, " ")), s || "");
}
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function renderBubble(b) {
  const node = el("div", "bubble " + (b.type || "dialogue"), keepNames(b.text));
  node.style.left = b.x + "%"; node.style.top = b.y + "%"; node.style.maxWidth = b.w + "%";
  if (b.type === "thought") {
    [[0.9, 1.2, 0.5], [1.6, 0.4, 0.32]].forEach(([dy, dx, s]) => {
      const dot = el("span", "dot");
      dot.style.width = dot.style.height = s + "em"; dot.style.bottom = -dy + "em"; dot.style.left = (30 - dx * 4) + "%";
      node.appendChild(dot);
    });
  } else if (b.tail && b.type !== "narration") {
    const t = el("span", "tail" + (b.tail === "up" ? " up" : ""));
    t.style.left = (b.tailX == null ? 50 : b.tailX) + "%";
    node.appendChild(t);
  }
  return node;
}
function renderFree(v, cls) {
  const node = el("div", cls, keepNames(v.text));
  node.style.left = v.x + "%"; node.style.top = v.y + "%";
  node.style.fontSize = v.size + "cqw"; node.style.setProperty("--rot", (v.rot || 0) + "deg");
  if (v.w) node.style.maxWidth = v.w + "%";
  return node;
}

(function init() {
  document.title = META.title + " — " + META.episode;
  document.getElementById("m-title").textContent = META.title;
  document.getElementById("m-ep").textContent = META.episode;
  const strip = document.getElementById("strip");
  PANELS.forEach(p => {
    const panel = el("div", "panel");
    const img = new Image(); img.loading = "lazy"; img.decoding = "async"; img.alt = p.alt; img.src = p.src;
    img.onerror = () => img.replaceWith(el("div", "missing", "⚠ " + p.src));
    panel.appendChild(img);
    (p.bubbles || []).forEach(b => panel.appendChild(renderBubble(b)));
    (p.env || []).forEach(v => panel.appendChild(renderFree(v, "env " + (v.style || "hand"))));
    (p.sfx || []).forEach(v => panel.appendChild(renderFree(v, "sfx")));
    strip.appendChild(panel);
    if (p.gapAfter) { const g = el("div", "gap"); g.style.height = p.gapAfter + "px"; strip.appendChild(g); }
  });
  document.getElementById("foot").textContent = META.footer || "";
})();
